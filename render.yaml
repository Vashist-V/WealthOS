# Render blueprint. In Render: New > Blueprint, then pick this repository.
# It builds the Dockerfile into one service that runs the web app and the API.
services:
  - type: web
    name: wealthos
    runtime: docker
    region: singapore # the closest Render region to India
    # "free" sleeps after 15 quiet minutes and loses its disk each time, so the
    # first visit afterwards is slow. "starter" stays awake.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render asks for these when the blueprint is created. They are the same
      # values as in backend/.env. Other settings (see the README's Configuration
      # table) can be added afterwards under the service's Environment tab.
      # Accounts:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # AI answers: Claude Opus 4.5 on Amazon Bedrock, with news research and
      # sources. The long-term Bedrock API key from HueEvalProject's .env.
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      # Free services that take over when Bedrock cannot answer:
      - key: GEMINI_API_KEY
        sync: false
      # A second free AI service (Groq) that takes over when Gemini's quota is used up:
      - key: LLM_API_KEY
        sync: false
      # How often the server visits its own address so the free plan does not
      # switch it off after 15 quiet minutes. The workspace's 750 free hours a
      # month cover one service kept awake most of the day: WealthOS is that
      # one, and CineGrade sleeps when idle. Never keep two free services awake,
      # or both get suspended mid-month.
      - key: KEEP_AWAKE_MINUTES
        value: "10"
      # The nightly window when it stops visiting itself and may sleep (India
      # time). Awake about 16.3 h a day, ~506 h in a 31-day month. The "Morning
      # wake-up" GitHub workflow wakes it at 09:50. "off" keeps it awake around
      # the clock (~744 h, which leaves CineGrade almost nothing).
      - key: KEEP_AWAKE_QUIET_HOURS
        value: "02:00-10:00 +05:30"

# Render blueprint. In Render: New > Blueprint, then pick this repository.
# It builds the Dockerfile into one service that runs the web app and the API.
services:
  - type: web
    name: wealthos
    runtime: docker
    region: singapore # the closest Render region to India
    # "free" sleeps after 15 quiet minutes and loses its disk each time, so the
    # first visit afterwards is slow. "starter" stays awake.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render asks for these when the blueprint is created. They are the same
      # values as in backend/.env. Other settings (see the README's Configuration
      # table) can be added afterwards under the service's Environment tab.
      # Accounts:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # AI answers: Claude Opus 4.5 on Amazon Bedrock, with news research and
      # sources. The long-term Bedrock API key from HueEvalProject's .env.
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      # Free services that take over when Bedrock cannot answer:
      - key: GEMINI_API_KEY
        sync: false
      # A second free AI service (Groq) that takes over when Gemini's quota is used up:
      - key: LLM_API_KEY
        sync: false
      # The server does not visit itself to stay awake: the workspace's 750 free
      # hours a month go mostly to CineGrade (awake 10 am to 2 am India time,
      # ~506 h), and two always-on free services would run out mid-month and get
      # both suspended. WealthOS sleeps after 15 quiet minutes and wakes on the
      # next visit; its page sends no keep-awake visits from 2 to 10 am.
      - key: KEEP_AWAKE_MINUTES
        value: "0"

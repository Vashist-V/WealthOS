<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="WealthOS — track, analyse and stress-test your investments in one place." />
    <meta name="theme-color" content="#0b0d12" />
    <!-- Every icon here is cut from brand/wealthos-logo.png by brand/make_assets.py. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Added to an iPhone or iPad home screen, the app opens full screen under this name. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WealthOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The picture and words shown when a link to the app is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WealthOS" />
    <meta property="og:title" content="WealthOS: track, analyze, plan, grow" />
    <meta property="og:description" content="See what your investments are really doing, and check a trade before you make it." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>WealthOS</title>
    <!-- What this deployment tells the page about itself. Must load before the app. -->
    <script src="/config.js"></script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("wealthos.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Shown from the first instant until the app has started, so opening WealthOS never begins with an empty screen. -->
    <style>
      html[data-theme="dark"] body { background: #0b0d12; }
      html[data-theme="light"] body { background: #f4f4f1; }
      .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 500 13px system-ui, sans-serif; color: #7d8493; }
      .boot img { width: 56px; height: 56px; border-radius: 22%; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: 0.55; transform: scale(0.96); } }
    </style>
    <div id="root">
      <div class="boot">
        <img src="/logo-mark.png" alt="" width="56" height="56" />
        <span>Opening WealthOS</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
